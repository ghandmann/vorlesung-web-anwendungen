<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meine TodoApp</title>
</head>
<body>
    <h1>Meine TodoApp</h1>
    <input type="text" id="todo-title"><button id="add-todo-button">Todo merken</button>
    <ul id="todo-list">
    </ul>
    <script>
        document.addEventListener("DOMContentLoaded", init);

        function init() {
            // EventListener registrieren
            const addButton = document.querySelector("#add-todo-button");
            addButton.addEventListener("click", addTodoItem);

            const todoInput = document.querySelector("#todo-title");
            todoInput.addEventListener("keyup", (event) => {
                if(event.key === "Enter") {
                    addTodoItem();
                }
            });
        }

        function addTodoItem() {
            const titleInput = document.querySelector("#todo-title");
            const todoTitle = titleInput.value;

            if(todoTitle === "") {
                return;
            }

            const todoItem = document.createElement("li");
            todoItem.innerText = todoTitle;
            todoItem.addEventListener("click", () => {
                todoItem.remove();
            });

            const todoList = document.querySelector("#todo-list");
            todoList.appendChild(todoItem);

            titleInput.value = "";
        }
    </script>
</body>
</html>
