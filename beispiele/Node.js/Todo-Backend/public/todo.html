<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meine TodoApp</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe" crossorigin="anonymous">
    <style>
        ul#todo-list li span.badge {
            cursor: pointer;
        }
    </style>
    <script type="module">
        import { nanoid } from 'https://cdn.jsdelivr.net/npm/nanoid/nanoid.js';
        // make nanoid globally available
        window.nanoid = nanoid;
    </script>
</head>
<body>
    <div class="container">
        <h1>Meine TodoApp</h1>
        <div class="input-group">
            <input type="text" id="todo-title" class="form-control">
            <button id="add-todo-button" class="btn-outline theme-success input-group-btn">Todo merken</button>
        </div>
        <ul class="list-group mt-5" id="todo-list">
        </ul>
    </div>
    <script>
        document.addEventListener("DOMContentLoaded", init);

        async function init() {
            registerEventListeners();

            const initialTodoItems = await loadTodoItemsFromBackend();
            renderTodoList(initialTodoItems);
        }

        function registerEventListeners() {
            // "Todo merken"-Button mit click-Handler versehen
            const addButton = document.querySelector("#add-todo-button");
            addButton.addEventListener("click", addTodoItem);

            // Text-Input-Feld mit key-event versehen
            const todoInput = document.querySelector("#todo-title");
            todoInput.addEventListener("keyup", (event) => {
                // Wenn Enter gedrückt wurde, addTodoItem aufrufen.
                if(event.key === "Enter") {
                    addTodoItem();
                }
            });
        }

        // Rendert die komplette TodoList neu
        function renderTodoList(todoItems) {
            clearTodoList();

            // Liste die alle "li"-Elemente puffert
            let todoListItems = [];

            todoItems.forEach((todoItem) => {
                // "li"-Element erzeugen
                const listItem = renderTodoListItem(todoItem);
                // "li"-Element im puffer ablegen
                todoListItems.push(listItem);
            });

            const todoList = document.querySelector("#todo-list");
            // Alle erzeugten "li"-Elemente in einem Rutsch anhängen (besser für die Performance)
            // '...' ist der spread-operator, der aus der Liste lauter einzelne Parameter macht
            todoList.append(...todoListItems);
        }

        function renderTodoListItem(todoItem) {
            // Neues "li"-Element erzeugen
            const listItem = document.createElement("li");
            listItem.innerText = todoItem.title;
            listItem.classList.add("list-group-item", "d-flex", "justify-content-between", "align-items-center");

            
            const trashCan = document.createElement("span");
            trashCan.classList.add("badge", "theme-primary");
            trashCan.innerText = "Erledigt";

            trashCan.addEventListener("click", async () => {
                listItem.remove();
                await removeTodoItemFromBackend(todoItem.id);
            });

            listItem.append(trashCan);

            return listItem;
        }

        // Löscht alle Kindelemente der TodoListe aus dem DOM
        // WICHTIG: Hat keinen Einfluss auf die gespeicherten TodoItems!
        function clearTodoList() {
            const todoList = document.querySelector("#todo-list");

            // innerHTML auf leeren String setzen, dadurch wird die Liste "geleert".
            todoList.innerHTML = "";
        }

        
        // Handler der ein neues TodoItem erzeugt
        function addTodoItem() {
            // Input-Element selektieren
            const titleInput = document.querySelector("#todo-title");
            // Aktuellen Wert aus dem titleInput holen
            const todoTitle = titleInput.value;

            if(todoTitle === "") {
                return;
            }

            // Todo persistieren
            const newTodoItem = {
                title: todoTitle,
                id: nanoid(),
                created: new Date().toISOString(),
            };

            storeTodoItemInBackend(newTodoItem);

            // HTML Representation erzeugen
            const todoItem = renderTodoListItem(newTodoItem);

            // Neu erzeugtes "li"-Element ans DOM anhängen
            const todoList = document.querySelector("#todo-list");
            todoList.appendChild(todoItem);

            // Text-Input resetten
            titleInput.value = "";
        }

        // Speichert ein TodoItem im Backend
        async function storeTodoItemInBackend(newTodoItem) {
            // In-Memory Object in JSON String umwandeln
            const todoItemBody = JSON.stringify(newTodoItem);

            // HTTP POST Request ans Backend schicken, mit JSON string im Body
            const response = await fetch("/api/v1/todos", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                },
                body: todoItemBody,
            });

            if(!response.ok) {
                alert("Failed to store todo item");
                return;
            }
        };

        // Lädt alle TodoItems via HTTP aus dem Backend
        async function loadTodoItemsFromBackend() {
            // Send HTTP GET Request
            const response = await fetch("/api/v1/todos");

            // Überprüfung auf erfolgreichen Request
            if(!response.ok) {
                alert("could not load todos from backend");
                return;
            }

            // JSON Body lesen und parsen
            const todoItems = await response.json();

            // Liste von TodoItems zurück geben
            return todoItems;
        }

        // Löscht ein TodoItem aus dem Backend
        async function removeTodoItemFromBackend(idToDelete) {
            // Passende URL erzeugen, mit TodoItem ID
            const deleteUrl = "/api/v1/todos/" + idToDelete;

            // HTTP DELETE Request schicken
            const response = await fetch(deleteUrl, {
                method: "DELETE",
            });

            if(!response.ok) {
                alert("failed to delete todoItem with id=" + idToDelete);
            }
        }
    </script>
</body>
</html>
